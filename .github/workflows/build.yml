name: Build Jam Widget

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project ZIP
        run: |
          test -f bulld.zip
          unzip -t bulld.zip

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q bulld.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jam-Widget-Indonesia-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
